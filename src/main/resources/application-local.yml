spring:
  data:
    mongodb:
      host: 127.0.0.1
      port: 27017
      database: qrcode
      uri: mongodb://localhost:27017/qrcode

app:
  cosmos-mongo:
    enabled: true
    connect-timeout-seconds: 10
    read-timeout-seconds: 30
    max-query-results: 500
    max-scan-documents: 50000
    date-filter-strategy: AUTO

