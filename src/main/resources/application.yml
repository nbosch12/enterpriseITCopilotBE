server:
  port: 8055

spring:
  application:
    name: docupedia-grounding-btp

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  docupedia:
    base-url: ${DOCUPEDIA_BASE_URL:https://inside-docupedia.bosch.com/confluence}
    bearer-token: ${DOCUPEDIA_BEARER_TOKEN:}
    page-size: ${DOCUPEDIA_PAGE_SIZE:100}
  chunking:
    max-chars: ${CHUNK_MAX_CHARS:3000}
    overlap-chars: ${CHUNK_OVERLAP_CHARS:300}
  s3:
    endpoint: ${S3_ENDPOINT:https://s3-eu-central-1.amazonaws.com}
    region: ${S3_REGION:eu-central-1}
    bucket: ${S3_BUCKET:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    path-style-access: ${S3_PATH_STYLE_ACCESS:true}
  sap-ai-core:
    token-url: ${AICORE_TOKEN_URL:}
    client-id: ${AICORE_CLIENT_ID:}
    client-secret: ${AICORE_CLIENT_SECRET:}
    api-url: ${AICORE_API_URL:}
    resource-group: ${AICORE_RESOURCE_GROUP:enterprise-it-copilot-rg}
    s3-generic-secret-name: ${AICORE_S3_GENERIC_SECRET:}
    embedding-deployment-id: ${AICORE_EMBEDDING_DEPLOYMENT_ID:}
    vector-search-prefix: ${AICORE_VECTOR_SEARCH_PREFIX:chunk-}
    orchestration-deployment-id: ${AICORE_ORCHESTRATION_DEPLOYMENT_ID:}
    embedding-model-name: ${AICORE_EMBEDDING_MODEL_NAME:text-embedding-3-large}
    llm-model-name: ${AICORE_LLM_MODEL_NAME:gpt-4o}
  azure-monitor:
    enabled: ${AZURE_MONITOR_ENABLED:false}
    workspace-id: ${AZURE_LOG_ANALYTICS_WORKSPACE_ID:}
    tenant-id: ${AZURE_TENANT_ID:}
    client-id: ${AZURE_CLIENT_ID:}
    client-secret: ${AZURE_CLIENT_SECRET:}
  cosmos-mongo:
    enabled: ${COSMOS_MONGO_ENABLED:false}
    # Use the complete Azure Cosmos DB for MongoDB connection string from Azure Portal.
    # Keep credentials in environment / BTP user-provided service / secret store, never source control.
    uri: ${COSMOS_MONGO_URI:}
    database: ${COSMOS_MONGO_DATABASE:}
    connect-timeout-seconds: ${COSMOS_MONGO_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${COSMOS_MONGO_READ_TIMEOUT_SECONDS:30}
    max-query-results: ${COSMOS_MONGO_MAX_QUERY_RESULTS:500}
